# The dashboard, plus the API behind the same address, so the dashboard
# calls /api/v1 on its own origin (as in development, through Vite's proxy).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Requests the dashboard makes to the API, and the widget script.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location /widget/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
  }

  # Built files carry a content hash in their names: cache them for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # A single-page app: every other path (a form, /referrals/<token>) is the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
