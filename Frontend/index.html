<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Configure accessible onboarding and career forms, preview the learner experience, and publish them to your website."
    />
    <title>Allora Accessibility Bridge · Accessible Onboarding</title>
    <!-- The dashboard's display settings (text size, contrast, motion,
         language), applied before the first paint so the page never flashes
         at the wrong size. Keep in step with src/display/displaySettings.js. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('bridge-display') || '{}') || {};
          var root = document.documentElement;
          if ([110, 125, 140, 150].indexOf(s.textScale) !== -1) root.style.fontSize = s.textScale + '%';
          root.setAttribute('data-contrast', s.contrast === 'high' ? 'high' : 'standard');
          var reduce = s.motion === 'reduce' || (s.motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches);
          root.setAttribute('data-motion', reduce ? 'reduce' : 'full');
          if (s.language === 'am') root.lang = 'am';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
